<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flappy Bird - Just like Ike's</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas" width="480" height="720" aria-label="Flappy Bird Canvas" role="img"></canvas>
      <div id="overlay" aria-live="polite" aria-atomic="true"></div>
      <div id="hud">
        <div id="score">0</div>
        <div id="instructions">Press Space/Up to flap. Press R to restart.</div>
      </div>
    </div>
    <script src="./main.js"></script>
  </body>
  </html>
